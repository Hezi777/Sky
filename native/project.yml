name: Sky
options:
  bundleIdPrefix: com.hen.sky
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  xcodeVersion: "26.5"
  generateEmptyDirectories: true
  createIntermediateGroups: true
  defaultConfig: Release
  fileTypes:
    icon:
      file: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Sky:
    type: application
    supportedDestinations: [macOS, iOS]
    deploymentTarget:
      macOS: "26.0"
      iOS: "26.0"
    sources:
      - path: Sky
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hen.sky.native
        PRODUCT_NAME: Sky
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Sky
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Sky shows local weather for your current location."
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: "YES"
    scheme:
      gatherCoverageData: false
